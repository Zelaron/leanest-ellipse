name = "LeanestEllipse"
version = "0.2.0"
keywords = ["math", "Radon transform", "interior problem", "operator theory", "convex geometry"]
defaultTargets = ["LeanestEllipse"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[lean_lib]]
name = "LeanestEllipse"
